<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="favBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0b1120" />
      <stop offset="100%" stopColor="#030712" />
    </linearGradient>
    <linearGradient id="favBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" stopOpacity="0.8" />
      <stop offset="50%" stopColor="#6366f1" stopOpacity="0.6" />
      <stop offset="100%" stopColor="#a855f7" stopOpacity="0.8" />
    </linearGradient>
    <linearGradient id="topPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="50%" stopColor="#3b82f6" />
      <stop offset="100%" stopColor="#8b5cf6" />
    </linearGradient>
    <linearGradient id="midPlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#a855f7" />
    </linearGradient>
    <linearGradient id="botPlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#6366f1" />
      <stop offset="100%" stopColor="#c084fc" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle with subtle gradient border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#favBgGrad)" stroke="url(#favBorderGrad)" stroke-width="2" />

  <!-- Ambient Glow Behind Stack -->
  <ellipse cx="32" cy="33" rx="16" ry="9" fill="#3b82f6" opacity="0.25" filter="url(#favGlow)" />

  <!-- Layer 3 (Bottom Foundation) -->
  <path d="M14 41.5 L32 49 L50 41.5" stroke="url(#botPlate)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Layer 2 (Middle Shelf) -->
  <path d="M14 33.5 L32 41 L50 33.5" stroke="url(#midPlate)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Layer 1 (Top Hero Diamond Card) -->
  <path d="M32 15 L48 22.5 L32 30 L16 22.5 Z" fill="url(#topPlate)" />
  
  <!-- Sleek Top Plate Highlight -->
  <path d="M32 17 L44 22.5 L32 28 L20 22.5 Z" fill="#ffffff" opacity="0.22" />
  
  <!-- Subtle Center Core Accent -->
  <circle cx="32" cy="22.5" r="2.2" fill="#ffffff" opacity="0.9" />
</svg>
