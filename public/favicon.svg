<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36" fill="none">
  <defs>
    <!-- Light Squircle Background Gradient matching Navbar .jobstack-logo__icon-wrap -->
    <linearGradient id="navCardBg" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="50%" stopColor="#eff6ff" />
      <stop offset="100%" stopColor="#f5f3ff" />
    </linearGradient>

    <!-- Top Plate Face Gradient -->
    <linearGradient id="jsTopGrad" x1="5" y1="3" x2="27" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="55%" stopColor="#3b82f6" />
      <stop offset="100%" stopColor="#8b5cf6" />
    </linearGradient>

    <!-- Top Plate Left Bevel Gradient -->
    <linearGradient id="jsTopLeftBevel" x1="5" y1="9" x2="16" y2="17" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#2563eb" />
      <stop offset="100%" stopColor="#1d4ed8" />
    </linearGradient>

    <!-- Top Plate Right Bevel Gradient -->
    <linearGradient id="jsTopRightBevel" x1="16" y1="11" x2="27" y2="17" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#7c3aed" />
      <stop offset="100%" stopColor="#5b21b6" />
    </linearGradient>

    <!-- Middle Tier Stroke Gradient -->
    <linearGradient id="jsMidGrad" x1="6" y1="16" x2="26" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="50%" stopColor="#60a5fa" />
      <stop offset="100%" stopColor="#a855f7" />
    </linearGradient>

    <!-- Bottom Tier Stroke Gradient -->
    <linearGradient id="jsBotGrad" x1="6" y1="22" x2="26" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#60a5fa" />
      <stop offset="50%" stopColor="#818cf8" />
      <stop offset="100%" stopColor="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Navbar Matching Rounded Squircle Card -->
  <rect
    x="1"
    y="1"
    width="34"
    height="34"
    rx="10"
    fill="url(#navCardBg)"
    stroke="#bfdbfe"
    stroke-width="1.2"
  />

  <!-- 3D Stack Icon Exactly Sized and Centered inside Container -->
  <g transform="translate(7, 7) scale(0.6875)">
    <!-- Tier 3: Foundation Bottom Chevron -->
    <path
      d="M6 22.5 L16 27.5 L26 22.5"
      stroke="url(#jsBotGrad)"
      stroke-width="2.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Tier 2: Middle Acceleration Chevron -->
    <path
      d="M6 16.5 L16 21.5 L26 16.5"
      stroke="url(#jsMidGrad)"
      stroke-width="2.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Tier 1: Bevel Sides -->
    <path
      d="M5.5 9.5 L16 14.8 L16 17 L5.5 11.7 Z"
      fill="url(#jsTopLeftBevel)"
    />
    <path
      d="M16 14.8 L26.5 9.5 L26.5 11.7 L16 17 Z"
      fill="url(#jsTopRightBevel)"
    />

    <!-- Tier 1: Summit Diamond Face -->
    <path
      d="M16 4.2 L26.5 9.5 L16 14.8 L5.5 9.5 Z"
      fill="url(#jsTopGrad)"
    />

    <!-- Specular Highlight -->
    <path
      d="M6.5 9.5 L16 4.8 L25.5 9.5"
      stroke="#ffffff"
      stroke-width="0.8"
      stroke-opacity="0.6"
      stroke-linecap="round"
    />

    <!-- Spark Node -->
    <circle cx="16" cy="9.5" r="1.8" fill="#ffffff" />
    <circle cx="16" cy="9.5" r="3.4" fill="#38bdf8" fill-opacity="0.45" />
  </g>
</svg>
